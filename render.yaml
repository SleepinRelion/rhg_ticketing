services:
  - type: web
    name: hotel-ticketing-backend
    env: node
    buildCommand: "cd server && npm install && npm run build:client"
    startCommand: "cd server && npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hotel-ticketing-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

databases:
  - name: hotel-ticketing-db
    databaseName: hoteltickets
    user: hoteladmin
    plan: free
