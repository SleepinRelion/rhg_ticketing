services:
  app:
    build: .
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=hotel_tickets
      - DB_USER=postgres
      - DB_PASSWORD=6ab2ed75f87999c88c95b2f10c4a8f56
      - DATABASE_URL=postgresql://postgres:6ab2ed75f87999c88c95b2f10c4a8f56@db:5432/hotel_tickets
      - APP_URL=http://localhost:3001
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', (res) => { if (res.statusCode !== 200) process.exit(1); })"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./uploads:/app/uploads
      - ./backups:/app/backups
      - ./server/scripts:/app/server/scripts
      - ./migrations:/app/migrations
      - ./.env:/app/.env

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 6ab2ed75f87999c88c95b2f10c4a8f56
      POSTGRES_DB: hotel_tickets
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hotel_tickets"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
